name: verify

on:
  push:
  pull_request:

# One job calling ./verify.sh, not a second definition of green written in
# YAML beside the first one. Two definitions drift, and then there is none.
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The example's end-to-end test skips without this, and the full tier
      # reports a skipped test as exit 2 - could not run. CI is the place that
      # has to actually run it.
      HARNESS_EXAMPLE_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # stable, not a pinned patch: govulncheck reports standard library
          # vulnerabilities against the toolchain that built the binary, so a
          # toolchain left behind for a few months fails this on its own.
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: sh verify.sh
